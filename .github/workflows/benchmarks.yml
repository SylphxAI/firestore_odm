name: Benchmarks

# Code generation time and runtime cost of firestore_odm, cloud_firestore_odm
# and raw cloud_firestore. Runs when the benchmarks or the generator change,
# and by hand; the report lands in the job summary. docs/guide/benchmarks.md
# quotes a run. Not a required check.

on:
  pull_request:
    paths:
      - benchmarks/**
      - packages/firestore_odm_builder/lib/**
      - .github/workflows/benchmarks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
        with:
          bootstrap: 'false'
      - name: Run benchmarks
        run: benchmarks/run.sh | tee -a "$GITHUB_STEP_SUMMARY"
