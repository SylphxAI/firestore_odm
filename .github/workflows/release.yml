name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      run_publish:
        description: 'Actually publish to pub.dev (uncheck for dry-run only)'
        type: boolean
        default: false
      run_versioning:
        description: 'Run automatic versioning based on conventional commits'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'  # Auto-publish when tags are pushed

jobs:
  e2e-gate:
    # Live semantics e2e against the Firestore emulator (ADR-0001/0002) —
    # required before any publish. Windows: cloud_firestore has Windows
    # platform support and hosted Windows runners can run GUI apps.
    runs-on: windows-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java (firebase-tools requires 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - name: 🔧 Setup Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: 🔥 Run Emulator E2E
        working-directory: apps/flutter_example
        shell: bash
        run: |
          npx --yes firebase-tools@latest emulators:exec \
            --only firestore --project demo-project \
            "flutter test integration_test -d windows --timeout 5m"

  release:
    runs-on: ubuntu-latest
    needs: [e2e-gate]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Load Package Versions
        id: versions
        run: |
          echo "PACKAGE_VERSION_ANNOTATION=$(grep '^version:' packages/firestore_odm_annotation/pubspec.yaml | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION_RUNTIME=$(grep '^version:' packages/firestore_odm/pubspec.yaml | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION_BUILDER=$(grep '^version:' packages/firestore_odm_builder/pubspec.yaml | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: 🚦 Enforce Stable-Only Versions (no -dev/-rc on pub.dev)
        run: |
          for v in "$PACKAGE_VERSION_ANNOTATION" "$PACKAGE_VERSION_RUNTIME" "$PACKAGE_VERSION_BUILDER"; do
            if [[ "$v" == *-* ]]; then
              echo "❌ Refusing to release pre-release version: $v (stable-only tags, ADR-0002)"
              exit 1
            fi
          done
          echo "✅ All package versions are stable: $PACKAGE_VERSION_ANNOTATION / $PACKAGE_VERSION_RUNTIME / $PACKAGE_VERSION_BUILDER"

      - name: 🐦 Setup Flutter & Bootstrap
        run: |
          export PATH="$RUNNER_TEMP/flutter/bin:$HOME/.pub-cache/bin:$PATH"
          ok=0
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/flutter"
            git clone --depth 1 -b 3.44.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter" \
              || { echo "::warning::clone failed (attempt $attempt)"; sleep 10; continue; }
            if [ ! -s "$RUNNER_TEMP/flutter/bin/internal/engine.version" ]; then
              echo "::warning::empty engine.version (attempt $attempt); re-cloning"; sleep 10; continue
            fi
            flutter --version \
              && flutter precache \
              && dart pub global activate melos \
              && melos bootstrap \
              && { ok=1; break; }
            echo "::warning::setup/bootstrap failed (attempt $attempt); retrying"; sleep 10
          done
          [ "$ok" = 1 ] || { echo "Flutter setup/bootstrap failed after retries"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$HOME/.pub-cache" >> "$GITHUB_ENV"

      - name: 📋 Dry Run Publish (annotation only — others resolve it from pub.dev)
        run: |
          # Remove pubspec_overrides.yaml files created by melos bootstrap
          find packages -name "pubspec_overrides.yaml" -delete
          cd packages/firestore_odm_annotation && dart pub publish --dry-run

      - name: 🔐 Setup Pub Credentials
        if: ${{ inputs.run_publish || startsWith(github.ref, 'refs/tags/') }}
        run: |
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          mkdir -p "$PUB_CACHE" ~/.config/dart
          printf '%s' '${{ secrets.PUB_CREDENTIALS }}' > "$PUB_CACHE/credentials.json"
          printf '%s' '${{ secrets.PUB_CREDENTIALS }}' > ~/.config/dart/pub-credentials.json
          ls -la "$PUB_CACHE/credentials.json" || true
          ls -la ~/.config/dart/pub-credentials.json || true

      - name: 🚀 Publish firestore_odm_annotation
        if: ${{ inputs.run_publish || startsWith(github.ref, 'refs/tags/') }}
        run: |
          rm -f packages/firestore_odm_annotation/pubspec_overrides.yaml
          cd packages/firestore_odm_annotation && dart pub get
          dart pub publish 2>&1 | tee /tmp/pub_annotation.txt
          # Verify pub.dev readback for the exact version (ADR-0002 deploy gate).
          for attempt in $(seq 1 18); do
            curl -fsS "https://pub.dev/api/packages/firestore_odm_annotation" -o /tmp/pubdev_annotation.json && break
            sleep 10
          done
          grep -qE '"version"\s*:\s*"${{ env.PACKAGE_VERSION_ANNOTATION }}"' /tmp/pubdev_annotation.json \
            && echo "✅ pub.dev readback verified for firestore_odm_annotation" \
            || (echo "❌ pub.dev readback failed for firestore_odm_annotation"; exit 1)

      - name: 🚀 Publish firestore_odm
        if: ${{ inputs.run_publish || startsWith(github.ref, 'refs/tags/') }}
        run: |
          rm -f packages/firestore_odm/pubspec_overrides.yaml
          cd packages/firestore_odm && dart pub get
          dart pub publish 2>&1 | tee /tmp/pub_runtime.txt
          for attempt in $(seq 1 18); do
            curl -fsS "https://pub.dev/api/packages/firestore_odm" -o /tmp/pubdev_runtime.json && break
            sleep 10
          done
          grep -qE '"version"\s*:\s*"${{ env.PACKAGE_VERSION_RUNTIME }}"' /tmp/pubdev_runtime.json \
            && echo "✅ pub.dev readback verified for firestore_odm" \
            || (echo "❌ pub.dev readback failed for firestore_odm"; exit 1)

      - name: 🚀 Publish firestore_odm_builder
        if: ${{ inputs.run_publish || startsWith(github.ref, 'refs/tags/') }}
        run: |
          rm -f packages/firestore_odm_builder/pubspec_overrides.yaml
          cd packages/firestore_odm_builder && dart pub get
          dart pub publish 2>&1 | tee /tmp/pub_builder.txt
          for attempt in $(seq 1 18); do
            curl -fsS "https://pub.dev/api/packages/firestore_odm_builder" -o /tmp/pubdev_builder.json && break
            sleep 10
          done
          grep -qE '"version"\s*:\s*"${{ env.PACKAGE_VERSION_BUILDER }}"' /tmp/pubdev_builder.json \
            && echo "✅ pub.dev readback verified for firestore_odm_builder" \
            || (echo "❌ pub.dev readback failed for firestore_odm_builder"; exit 1)

      - name: 📊 Create Release
        # Only on tag pushes — workflow_dispatch would otherwise make a bogus release.
        if: ${{ startsWith(github.ref, 'refs/tags/') && success() }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            🎉 **Firestore ODM Packages Released (5.0 clean break, ADR-0002)**

            ## 📦 Published Packages
            - [firestore_odm_annotation](https://pub.dev/packages/firestore_odm_annotation)
            - [firestore_odm](https://pub.dev/packages/firestore_odm)
            - [firestore_odm_builder](https://pub.dev/packages/firestore_odm_builder)

            ## 🔗 Links
            - **Repository**: https://github.com/SylphxAI/firestore_odm
            - **Documentation**: https://pub.dev/documentation/firestore_odm/latest/
            - **Issues**: https://github.com/SylphxAI/firestore_odm/issues
          draft: false
          prerelease: false

      - name: 📊 Summary
        if: success()
        run: |
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [firestore_odm_annotation](https://pub.dev/packages/firestore_odm_annotation)" >> $GITHUB_STEP_SUMMARY
          echo "- [firestore_odm](https://pub.dev/packages/firestore_odm)" >> $GITHUB_STEP_SUMMARY
          echo "- [firestore_odm_builder](https://pub.dev/packages/firestore_odm_builder)" >> $GITHUB_STEP_SUMMARY

  # Real publish verification: exact-version readback from the pub.dev API.
  verify-publish:
    runs-on: ubuntu-latest
    if: ${{ inputs.run_publish || startsWith(github.ref, 'refs/tags/') }}
    needs: release
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 📦 Load Package Versions
        run: |
          echo "PACKAGE_VERSION_ANNOTATION=$(grep '^version:' packages/firestore_odm_annotation/pubspec.yaml | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION_RUNTIME=$(grep '^version:' packages/firestore_odm/pubspec.yaml | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION_BUILDER=$(grep '^version:' packages/firestore_odm_builder/pubspec.yaml | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: ✅ Verify Published Packages (exact-version readback)
        run: |
          for pkg in firestore_odm_annotation:$PACKAGE_VERSION_ANNOTATION \
                       firestore_odm:$PACKAGE_VERSION_RUNTIME \
                       firestore_odm_builder:$PACKAGE_VERSION_BUILDER; do
            name="${pkg%%:*}"; ver="${pkg##*:}"
            for attempt in $(seq 1 18); do
              body=$(curl -fsS "https://pub.dev/api/packages/$name") && break
              sleep 10
            done
            if echo "$body" | grep -qE '"version"\s*:\s*"$ver"'; then
              echo "✅ $name $ver verified on pub.dev"
            else
              echo "❌ $name $ver NOT found on pub.dev"
              exit 1
            fi
          done
