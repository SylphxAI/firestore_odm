name: Release

# Pushing a `v<version>` tag on a commit that is on main publishes
# firestore_odm_annotation, firestore_odm and firestore_odm_builder to pub.dev
# (all three share one version), checks each version is served by pub.dev,
# and creates the GitHub release. Running it by hand does a dry run only.
#
# Authentication: pub.dev automated publishing (GitHub OIDC). Until the owner
# enables it on each package's pub.dev admin page, the PUB_CREDENTIALS secret
# is used instead; delete that secret once OIDC publishing is enabled.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      id-token: write # pub.dev automated publishing
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the version and the tagged commit
        run: |
          versions=""
          for package in firestore_odm_annotation firestore_odm firestore_odm_builder; do
            v="$(sed -n 's/^version:[[:space:]]*//p' "packages/$package/pubspec.yaml" | tr -d "\"'")"
            case "$v" in *-*) echo "::error::$package $v is a pre-release; pub.dev gets stable versions only"; exit 1;; esac
            versions="$versions $v"
          done
          version="$(echo $versions | tr ' ' '\n' | sort -u)"
          [ "$(echo "$version" | wc -l)" = 1 ] || { echo "::error::package versions differ:$versions"; exit 1; }
          if [ "$PUBLISH" = true ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on main (the merge queue has not tested it)"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-flutter

      - name: Publish dry run
        run: melos run publish:dry-run --no-select

      - name: Authenticate with pub.dev
        if: env.PUBLISH == 'true'
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          if [ -z "$PUB_CREDENTIALS" ]; then
            echo "PUB_OIDC=true" >> "$GITHUB_ENV"
            dart pub token add https://pub.dev --env-var PUB_TOKEN
          else
            umask 077
            mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/dart"
            printf '%s' "$PUB_CREDENTIALS" > "${XDG_CONFIG_HOME:-$HOME/.config}/dart/pub-credentials.json"
          fi

      - name: Publish to pub.dev
        if: env.PUBLISH == 'true'
        run: |
          set -o pipefail
          publish() {
            local package="$1"
            if [ "${PUB_OIDC:-}" = true ]; then
              # GitHub OIDC tokens are short-lived: request one per package.
              PUB_TOKEN="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://pub.dev" | jq -r .value)"
              echo "::add-mask::$PUB_TOKEN"
              export PUB_TOKEN
            fi
            rm -f "packages/$package/pubspec_overrides.yaml"
            (cd "packages/$package" && dart pub get)
            if ! (cd "packages/$package" && dart pub publish --force) 2>&1 | tee /tmp/publish.txt; then
              grep -q "already exists" /tmp/publish.txt || exit 1
              echo "$package $VERSION was already published"
            fi
            # The next package resolves this one from pub.dev.
            for attempt in $(seq 1 30); do
              curl -fsS "https://pub.dev/api/packages/$package/versions/$VERSION" > /dev/null && return 0
              sleep 10
            done
            echo "::error::pub.dev does not serve $package $VERSION"
            exit 1
          }
          publish firestore_odm_annotation
          publish firestore_odm
          publish firestore_odm_builder

      - name: Remove pub.dev credentials
        if: always()
        run: rm -f "${XDG_CONFIG_HOME:-$HOME/.config}/dart/pub-credentials.json"

      - name: Create the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's section of the firestore_odm changelog.
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / && on {exit} on' \
            packages/firestore_odm/CHANGELOG.md > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
