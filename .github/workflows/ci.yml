name: CI

# Each check runs once per landed change. Pull requests run the Linux checks;
# the merge queue runs the macOS/Windows tests and the Firestore emulator
# end-to-end tests. `ci-success` is the one required status check for both.
#
# Flutter is pinned in .github/actions/setup-flutter; bump it on purpose.

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter

      - name: Format
        run: melos run format:check --no-select
      - name: Generate code
        run: melos run generate
      - name: Analyze
        run: melos run analyze --no-select
      - name: Test (unit, generated code, benchmarks)
        run: melos run test:all --no-select
      - name: API docs
        run: melos exec --scope="firestore_odm,firestore_odm_annotation,firestore_odm_builder" -- dart doc --validate-links --dry-run
      - name: Publish dry run
        run: melos run publish:dry-run --no-select
      - name: pub.dev score (pana)
        # Allows 10 lost points: pana also scores "latest dependency
        # versions", which moves with outside releases. Dependencies resolve
        # from pub.dev.
        run: |
          # firestore_odm's README is a link to the repository README; publish
          # copies the file, so give pana the copy too.
          cp --remove-destination README.md packages/firestore_odm/README.md
          dart pub global activate pana
          melos exec --scope="firestore_odm,firestore_odm_annotation,firestore_odm_builder" -- dart pub global run pana --no-warning --exit-code-threshold 10 .

  site:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - name: Build (fails on dead links)
        run: npm run build

  platforms:
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter
      - name: Generate code
        run: melos run generate
      - name: Test
        run: melos run test:all --no-select

  e2e-emulator:
    # The Firestore emulator checks storage types, index errors and real
    # query semantics that the in-memory fake cannot. Windows: cloud_firestore
    # has no Linux desktop implementation, and hosted Windows runners can run
    # the desktop test app.
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
      - name: Generate code
        run: melos run generate
      - name: Emulator end-to-end tests
        working-directory: apps/flutter_example
        shell: bash
        run: |
          npx --yes firebase-tools@latest emulators:exec \
            --only firestore --project demo-project \
            "flutter test integration_test -d windows --timeout 5m"

  ci-success:
    if: always()
    needs: [check, site, platforms, e2e-emulator]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
