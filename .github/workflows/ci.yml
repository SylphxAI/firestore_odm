name: CI

# Optimistic merge. Merge groups and draft pull requests run the fast lanes
# only (brand, links, format, code generation, analyze). A pull request marked
# ready also runs the full suite (verify.yml); after merge verify.yml runs
# again on main. `ci-ok` is the one required check. Public repository:
# GitHub-hosted standard runners, guarded so a private fork never runs them.
#
# Flutter is pinned in .github/actions/setup-flutter; bump it on purpose.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  main-state:
    if: github.event_name == 'merge_group' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/main-red-gate@05ac6474b96425bcb4965addd025a93e061b66c4
        with:
          mode: observe

  lint:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Brand files
        # Fails when a brand file or a surface copy drifts from brand/.
        uses: SylphxAI/.github/.github/actions/brand@a6c81b4bcda66bf624f0a68e25e63b3c0ed043eb # shared brand generator

      - name: README links are absolute (pub.dev page)
        run: sh scripts/check-readme-links.sh

      - uses: ./.github/actions/setup-flutter

      - name: Format
        run: melos run format:check --no-select
      - name: Generate code
        run: melos run generate
      - name: Analyze
        run: melos run analyze --no-select

  identifiers:
    if: github.event_name != 'merge_group' && github.event.repository.private == false
    name: Identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@e4a5ea41cbcc87cd93914f89f0d7c3981c868bf9

  suite:
    if: github.event_name != 'merge_group' && !github.event.pull_request.draft && github.event.repository.private == false
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  ci-ok:
    if: always() && github.event.repository.private == false
    needs: [main-state, lint, identifiers, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@05ac6474b96425bcb4965addd025a93e061b66c4
        with:
          needs: ${{ toJSON(needs) }}
          required: lint
          required-unless-merge-group: ${{ github.event.pull_request.draft && 'identifiers' || 'identifiers,suite' }}
