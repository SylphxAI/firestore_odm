name: CI

on:
  merge_group:
  workflow_dispatch: # Manual trigger
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Flutter is pinned to the current stable, 3.44.2 (Dart 3.12.2), deliberately —
# bump it on purpose in .github/actions/setup-flutter, don't float
# `channel: stable` (silent drift previously broke CI). The builder needs
# analyzer >=9 (Dart >=3.9). Every job sets Flutter up through that one
# composite action.

permissions:
  contents: read

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Code quality checks
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter

      - name: 🎨 Check Code Formatting
        run: melos run format:check --no-select

      - name: 🔍 Analyze Code
        run: melos run analyze --no-select

      - name: 📋 Validate Publishing
        run: melos run publish:dry-run --no-select

  # Test matrix
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - profile: linux-standard
            runner: ubuntu-latest
            flutter-version: '3.44.2'
          - profile: macos-standard
            runner: macos-latest
            flutter-version: '3.44.2'
          - profile: windows-standard
            runner: windows-latest
            flutter-version: '3.44.2'
      fail-fast: false

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ matrix.flutter-version }}

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: 🧪 Run Unit Tests
        run: melos run test:unit --no-select

      - name: 🔬 Run Integration Tests
        run: melos run test:integration --no-select

  # Code coverage
  coverage:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: 📊 Generate Coverage
        # All tests live in flutter_example; `flutter test --coverage` writes
        # apps/flutter_example/coverage/lcov.info. (The old format_coverage step
        # relied on the removed `.packages` file and had no coverage input.)
        # --concurrency=1: runners have exhausted threads (pthread_create
        # failed) under coverage instrumentation at the default concurrency.
        run: melos exec --scope="flutter_example" -- flutter test --coverage --concurrency=1

      - name: 📤 Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          files: apps/flutter_example/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Performance testing
  performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [quality]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: ⚡ Performance Benchmarks
        run: melos exec --scope="flutter_example" -- flutter test test/benchmarks_test.dart --concurrency=1 2>&1 | tee /tmp/benchmarks.txt

      - name: 📦 Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: /tmp/benchmarks.txt
          retention-days: 30

  # Security scanning
  security:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter

      - name: 🔒 Known-Vulnerability Scan
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --lockfile=apps/flutter_example/pubspec.lock \
            --lockfile=packages/firestore_odm/pubspec.lock \
            --lockfile=packages/firestore_odm_annotation/pubspec.lock \
            --lockfile=packages/firestore_odm_builder/pubspec.lock

      - name: 🔒 Security Audit
        run: |
          # Check outdated dependencies (informational).
          melos run deps:outdated --no-select || true

          # Package scoring (informational).
          dart pub global activate pana
          melos exec -- "dart pub global run pana --no-warning ."

  # Documentation generation test
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter

      - name: 📖 Generate Documentation
        run: |
          melos exec --scope="firestore_odm*" -- "dart doc --validate-links"

  # Live semantics e2e against the Firestore emulator (ADR-0002). The fake
  # cannot model Timestamp storage, index errors or real query semantics; this
  # lane is the deploy-layer behavior gate.
  e2e-emulator:
    # Visibility lane; the authoritative emulator gate runs in release.yml
    # (e2e-gate) and blocks publishing. Windows: cloud_firestore has Windows
    # platform support and hosted Windows runners can run GUI apps.
    continue-on-error: true
    runs-on: windows-latest
    needs: [quality]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java (emulator runtime; firebase-tools requires 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - name: 🔧 Setup Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: 🔥 Run Emulator E2E
        working-directory: apps/flutter_example
        shell: bash
        run: |
          npx --yes firebase-tools@latest emulators:exec \
            --only firestore --project demo-project \
            "flutter test integration_test -d windows --timeout 5m"

  # CI results summary
  ci-success:
    runs-on: ubuntu-latest
    # e2e-emulator is the RELEASE gate (ADR-0001/0002): it runs on every CI
    # run for visibility, but release.yml re-runs it and gates publishing.
    needs: [quality, test, coverage, security, docs, performance]
    if: always()
    steps:
      - name: 📊 CI Results Summary
        run: |
          echo "## 🎯 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.quality.result }}" == "success" ]]; then
            echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "✅ **Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.coverage.result }}" == "success" ]]; then
            echo "✅ **Coverage**: Generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Coverage**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.security.result }}" == "success" ]]; then
            echo "✅ **Security**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security**: Issues Found" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.docs.result }}" == "success" ]]; then
            echo "✅ **Documentation**: Generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Documentation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Repository**: https://github.com/SylphxAI/firestore_odm" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if any job failed
        # performance only runs on pull requests; a skipped result is OK.
        if: ${{ needs.quality.result != 'success' || needs.test.result != 'success' || needs.coverage.result != 'success' || needs.security.result != 'success' || needs.docs.result != 'success' || (needs.performance.result != 'success' && needs.performance.result != 'skipped') }}
        run: exit 1

      - name: ✅ All CI Checks Passed
        run: |
          echo "🎉 All CI checks passed successfully!"
          echo "Ready for merge or release! 🚀"
