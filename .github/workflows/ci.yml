name: CI

on:
  workflow_dispatch: # Manual trigger
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]

jobs:
  # Code quality checks
  quality:
    runs-on: [self-hosted, sylphx, linux, standard]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: project targets Dart ^3.8.1 / analyzer ^7.4.5. Newer Flutter
          # stable (Dart >=3.12) resolves test/analyzer >=8 and breaks
          # `melos bootstrap`. Revisit when the analyzer 8.x upgrade lands.
          flutter-version: 3.32.8
          # cache disabled on self-hosted runners: a restored partial Flutter
          # cache leaves the engine version empty, so `flutter precache` builds a
          # malformed `flutter//flutter_gpu.zip` URL and `melos bootstrap` fails
          # intermittently. A clean install resolves the version correctly.
          cache: false

      - name: 🔧 Setup Melos
        run: dart pub global activate melos

      - name: 📦 Bootstrap Dependencies
        run: |
          # Run `flutter precache` once, serially, before melos kicks off
          # concurrent `flutter pub get`s. Those concurrent runs otherwise race
          # to precache artifacts and intermittently resolve an empty engine
          # version — producing the broken `flutter//flutter_gpu.zip` URL and a
          # failed bootstrap. Retry to absorb transient download failures too.
          for attempt in 1 2 3; do
            flutter precache && melos bootstrap && exit 0
            echo "::warning::bootstrap attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          exit 1

      - name: 🎨 Check Code Formatting
        run: melos run format:check --no-select

      - name: 🔍 Analyze Code
        run: melos run analyze --no-select

      - name: 📋 Validate Publishing
        run: melos run publish:dry-run --no-select

  # Test matrix
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Pinned to a project-compatible version (Dart 3.8.x). The stable/beta
        # channel matrix broke once stable moved to Dart >=3.12 (analyzer 8.x).
        flutter-version: ['3.32.8']
      fail-fast: false

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: 🔧 Setup Melos
        run: dart pub global activate melos

      - name: 📦 Bootstrap Dependencies
        run: |
          # Run `flutter precache` once, serially, before melos kicks off
          # concurrent `flutter pub get`s. Those concurrent runs otherwise race
          # to precache artifacts and intermittently resolve an empty engine
          # version — producing the broken `flutter//flutter_gpu.zip` URL and a
          # failed bootstrap. Retry to absorb transient download failures too.
          for attempt in 1 2 3; do
            flutter precache && melos bootstrap && exit 0
            echo "::warning::bootstrap attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          exit 1

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: 🧪 Run Unit Tests
        run: melos run test:unit --no-select

      - name: 🔬 Run Integration Tests
        run: melos run test:integration --no-select

  # Code coverage
  coverage:
    runs-on: [self-hosted, sylphx, linux, standard]
    needs: [quality, test]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: project targets Dart ^3.8.1 / analyzer ^7.4.5. Newer Flutter
          # stable (Dart >=3.12) resolves test/analyzer >=8 and breaks
          # `melos bootstrap`. Revisit when the analyzer 8.x upgrade lands.
          flutter-version: 3.32.8
          # cache disabled on self-hosted runners: a restored partial Flutter
          # cache leaves the engine version empty, so `flutter precache` builds a
          # malformed `flutter//flutter_gpu.zip` URL and `melos bootstrap` fails
          # intermittently. A clean install resolves the version correctly.
          cache: false

      - name: 🔧 Setup Melos
        run: dart pub global activate melos

      - name: 📦 Bootstrap Dependencies
        run: |
          # Run `flutter precache` once, serially, before melos kicks off
          # concurrent `flutter pub get`s. Those concurrent runs otherwise race
          # to precache artifacts and intermittently resolve an empty engine
          # version — producing the broken `flutter//flutter_gpu.zip` URL and a
          # failed bootstrap. Retry to absorb transient download failures too.
          for attempt in 1 2 3; do
            flutter precache && melos bootstrap && exit 0
            echo "::warning::bootstrap attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          exit 1

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: 📊 Generate Coverage
        # All tests live in flutter_example; `flutter test --coverage` writes
        # apps/flutter_example/coverage/lcov.info. (The old format_coverage step
        # relied on the removed `.packages` file and had no coverage input.)
        run: melos exec --scope="flutter_example" -- flutter test --coverage

      - name: 📤 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: apps/flutter_example/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Performance testing
  performance:
    runs-on: [self-hosted, sylphx, linux, standard]
    if: github.event_name == 'pull_request'
    needs: [quality]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: project targets Dart ^3.8.1 / analyzer ^7.4.5. Newer Flutter
          # stable (Dart >=3.12) resolves test/analyzer >=8 and breaks
          # `melos bootstrap`. Revisit when the analyzer 8.x upgrade lands.
          flutter-version: 3.32.8
          # cache disabled on self-hosted runners: a restored partial Flutter
          # cache leaves the engine version empty, so `flutter precache` builds a
          # malformed `flutter//flutter_gpu.zip` URL and `melos bootstrap` fails
          # intermittently. A clean install resolves the version correctly.
          cache: false

      - name: 🔧 Setup Melos
        run: dart pub global activate melos

      - name: 📦 Bootstrap Dependencies
        run: |
          # Run `flutter precache` once, serially, before melos kicks off
          # concurrent `flutter pub get`s. Those concurrent runs otherwise race
          # to precache artifacts and intermittently resolve an empty engine
          # version — producing the broken `flutter//flutter_gpu.zip` URL and a
          # failed bootstrap. Retry to absorb transient download failures too.
          for attempt in 1 2 3; do
            flutter precache && melos bootstrap && exit 0
            echo "::warning::bootstrap attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          exit 1

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: ⚡ Performance Benchmarks
        run: melos exec --scope="flutter_example" -- flutter test --dart-define=PERFORMANCE_TEST=true

  # Security scanning
  security:
    runs-on: [self-hosted, sylphx, linux, standard]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: project targets Dart ^3.8.1 / analyzer ^7.4.5. Newer Flutter
          # stable (Dart >=3.12) resolves test/analyzer >=8 and breaks
          # `melos bootstrap`. Revisit when the analyzer 8.x upgrade lands.
          flutter-version: 3.32.8
          # cache disabled on self-hosted runners: a restored partial Flutter
          # cache leaves the engine version empty, so `flutter precache` builds a
          # malformed `flutter//flutter_gpu.zip` URL and `melos bootstrap` fails
          # intermittently. A clean install resolves the version correctly.
          cache: false

      - name: 🔧 Setup Melos
        run: dart pub global activate melos

      - name: 📦 Bootstrap Dependencies
        run: |
          # Run `flutter precache` once, serially, before melos kicks off
          # concurrent `flutter pub get`s. Those concurrent runs otherwise race
          # to precache artifacts and intermittently resolve an empty engine
          # version — producing the broken `flutter//flutter_gpu.zip` URL and a
          # failed bootstrap. Retry to absorb transient download failures too.
          for attempt in 1 2 3; do
            flutter precache && melos bootstrap && exit 0
            echo "::warning::bootstrap attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          exit 1

      - name: 🔒 Security Audit
        run: |
          # Check outdated dependencies
          melos run deps:outdated --no-select || true
          
          # Check for known security vulnerabilities
          dart pub global activate pana
          melos exec -- "dart pub global run pana --no-warning ."

  # Documentation generation test
  docs:
    runs-on: [self-hosted, sylphx, linux, standard]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: project targets Dart ^3.8.1 / analyzer ^7.4.5. Newer Flutter
          # stable (Dart >=3.12) resolves test/analyzer >=8 and breaks
          # `melos bootstrap`. Revisit when the analyzer 8.x upgrade lands.
          flutter-version: 3.32.8
          # cache disabled on self-hosted runners: a restored partial Flutter
          # cache leaves the engine version empty, so `flutter precache` builds a
          # malformed `flutter//flutter_gpu.zip` URL and `melos bootstrap` fails
          # intermittently. A clean install resolves the version correctly.
          cache: false

      - name: 🔧 Setup Melos
        run: dart pub global activate melos

      - name: 📦 Bootstrap Dependencies
        run: |
          # Run `flutter precache` once, serially, before melos kicks off
          # concurrent `flutter pub get`s. Those concurrent runs otherwise race
          # to precache artifacts and intermittently resolve an empty engine
          # version — producing the broken `flutter//flutter_gpu.zip` URL and a
          # failed bootstrap. Retry to absorb transient download failures too.
          for attempt in 1 2 3; do
            flutter precache && melos bootstrap && exit 0
            echo "::warning::bootstrap attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          exit 1

      - name: 📖 Generate Documentation
        run: |
          melos exec --scope="firestore_odm*" -- "dart doc --validate-links"

  # CI results summary
  ci-success:
    runs-on: [self-hosted, sylphx, linux, standard]
    needs: [quality, test, coverage, security, docs]
    if: always()
    steps:
      - name: 📊 CI Results Summary
        run: |
          echo "## 🎯 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.quality.result }}" == "success" ]]; then
            echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "✅ **Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.coverage.result }}" == "success" ]]; then
            echo "✅ **Coverage**: Generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Coverage**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.security.result }}" == "success" ]]; then
            echo "✅ **Security**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security**: Issues Found" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.docs.result }}" == "success" ]]; then
            echo "✅ **Documentation**: Generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Documentation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Repository**: https://github.com/SylphxAI/firestore_odm" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if any job failed
        if: ${{ needs.quality.result != 'success' || needs.test.result != 'success' || needs.security.result != 'success' || needs.docs.result != 'success' }}
        run: exit 1

      - name: ✅ All CI Checks Passed
        run: |
          echo "🎉 All CI checks passed successfully!"
          echo "Ready for merge or release! 🚀"