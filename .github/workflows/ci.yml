name: CI

on:
  merge_group:
  workflow_dispatch: # Manual trigger
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Flutter is pinned to the current stable, 3.44.2 (Dart 3.12.2), deliberately —
# bump it on purpose, don't float `channel: stable` (silent drift previously
# broke CI). The builder needs analyzer >=9 (Dart >=3.9), so 3.32.x no longer
# works.
#
# Self-hosted jobs install Flutter via a shallow git clone instead of
# subosito/flutter-action: the archive install intermittently produced a Flutter
# SDK with an empty engine version on these runners, yielding a broken
# `flutter//flutter_gpu.zip` URL and a failed bootstrap. A git checkout always
# resolves the engine version correctly. The GitHub-hosted test matrix keeps the
# action (it never showed the issue and its cache speeds up the 3-OS matrix).

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Code quality checks
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        run: |
          # These self-hosted runners intermittently produce an incomplete
          # Flutter checkout (empty bin/internal/engine.version), which yields a
          # broken `flutter//flutter_gpu.zip` URL and a failed bootstrap. Re-clone
          # until the engine version is present, precache serially before melos'
          # concurrent pub gets, and retry to absorb transient failures.
          export PATH="$RUNNER_TEMP/flutter/bin:$HOME/.pub-cache/bin:$PATH"
          ok=0
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/flutter"
            git clone --depth 1 -b 3.44.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter" \
              || { echo "::warning::clone failed (attempt $attempt)"; sleep 10; continue; }
            if [ ! -s "$RUNNER_TEMP/flutter/bin/internal/engine.version" ]; then
              echo "::warning::empty engine.version (attempt $attempt); re-cloning"; sleep 10; continue
            fi
            flutter --version \
              && flutter precache \
              && dart pub global activate melos \
              && melos bootstrap \
              && { ok=1; break; }
            echo "::warning::setup/bootstrap failed (attempt $attempt); retrying"; sleep 10
          done
          [ "$ok" = 1 ] || { echo "Flutter setup/bootstrap failed after retries"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: 🎨 Check Code Formatting
        run: melos run format:check --no-select

      - name: 🔍 Analyze Code
        run: melos run analyze --no-select

      - name: 📋 Validate Publishing
        run: melos run publish:dry-run --no-select

  # Test matrix
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Pinned to current stable (bump deliberately, don't float a channel).
        flutter-version: ['3.44.2']
      fail-fast: false

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: 🔧 Setup Melos
        run: dart pub global activate melos

      - name: 📦 Bootstrap Dependencies
        run: melos bootstrap

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: 🧪 Run Unit Tests
        run: melos run test:unit --no-select

      - name: 🔬 Run Integration Tests
        run: melos run test:integration --no-select

  # Code coverage
  coverage:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        run: |
          # These self-hosted runners intermittently produce an incomplete
          # Flutter checkout (empty bin/internal/engine.version), which yields a
          # broken `flutter//flutter_gpu.zip` URL and a failed bootstrap. Re-clone
          # until the engine version is present, precache serially before melos'
          # concurrent pub gets, and retry to absorb transient failures.
          export PATH="$RUNNER_TEMP/flutter/bin:$HOME/.pub-cache/bin:$PATH"
          ok=0
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/flutter"
            git clone --depth 1 -b 3.44.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter" \
              || { echo "::warning::clone failed (attempt $attempt)"; sleep 10; continue; }
            if [ ! -s "$RUNNER_TEMP/flutter/bin/internal/engine.version" ]; then
              echo "::warning::empty engine.version (attempt $attempt); re-cloning"; sleep 10; continue
            fi
            flutter --version \
              && flutter precache \
              && dart pub global activate melos \
              && melos bootstrap \
              && { ok=1; break; }
            echo "::warning::setup/bootstrap failed (attempt $attempt); retrying"; sleep 10
          done
          [ "$ok" = 1 ] || { echo "Flutter setup/bootstrap failed after retries"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: 📊 Generate Coverage
        # All tests live in flutter_example; `flutter test --coverage` writes
        # apps/flutter_example/coverage/lcov.info. (The old format_coverage step
        # relied on the removed `.packages` file and had no coverage input.)
        # --concurrency=1: the self-hosted runners exhaust threads
        # (pthread_create failed) under coverage instrumentation at the default
        # concurrency. Lower it for a reliable (if slower) coverage run.
        run: melos exec --scope="flutter_example" -- flutter test --coverage --concurrency=1

      - name: 📤 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: apps/flutter_example/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Performance testing
  performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [quality]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        run: |
          # These self-hosted runners intermittently produce an incomplete
          # Flutter checkout (empty bin/internal/engine.version), which yields a
          # broken `flutter//flutter_gpu.zip` URL and a failed bootstrap. Re-clone
          # until the engine version is present, precache serially before melos'
          # concurrent pub gets, and retry to absorb transient failures.
          export PATH="$RUNNER_TEMP/flutter/bin:$HOME/.pub-cache/bin:$PATH"
          ok=0
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/flutter"
            git clone --depth 1 -b 3.44.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter" \
              || { echo "::warning::clone failed (attempt $attempt)"; sleep 10; continue; }
            if [ ! -s "$RUNNER_TEMP/flutter/bin/internal/engine.version" ]; then
              echo "::warning::empty engine.version (attempt $attempt); re-cloning"; sleep 10; continue
            fi
            flutter --version \
              && flutter precache \
              && dart pub global activate melos \
              && melos bootstrap \
              && { ok=1; break; }
            echo "::warning::setup/bootstrap failed (attempt $attempt); retrying"; sleep 10
          done
          [ "$ok" = 1 ] || { echo "Flutter setup/bootstrap failed after retries"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: ⚡ Performance Benchmarks
        run: melos exec --scope="flutter_example" -- flutter test test/benchmarks_test.dart --concurrency=1 2>&1 | tee /tmp/benchmarks.txt

      - name: 📦 Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: /tmp/benchmarks.txt
          retention-days: 30

  # Security scanning
  security:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        run: |
          # These self-hosted runners intermittently produce an incomplete
          # Flutter checkout (empty bin/internal/engine.version), which yields a
          # broken `flutter//flutter_gpu.zip` URL and a failed bootstrap. Re-clone
          # until the engine version is present, precache serially before melos'
          # concurrent pub gets, and retry to absorb transient failures.
          export PATH="$RUNNER_TEMP/flutter/bin:$HOME/.pub-cache/bin:$PATH"
          ok=0
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/flutter"
            git clone --depth 1 -b 3.44.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter" \
              || { echo "::warning::clone failed (attempt $attempt)"; sleep 10; continue; }
            if [ ! -s "$RUNNER_TEMP/flutter/bin/internal/engine.version" ]; then
              echo "::warning::empty engine.version (attempt $attempt); re-cloning"; sleep 10; continue
            fi
            flutter --version \
              && flutter precache \
              && dart pub global activate melos \
              && melos bootstrap \
              && { ok=1; break; }
            echo "::warning::setup/bootstrap failed (attempt $attempt); retrying"; sleep 10
          done
          [ "$ok" = 1 ] || { echo "Flutter setup/bootstrap failed after retries"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: 🔒 Security Audit
        run: |
          # Known-vulnerability scan (fails on findings).
          melos exec -- "dart pub audit"

          # Check outdated dependencies (informational).
          melos run deps:outdated --no-select || true

          # Package scoring (informational).
          dart pub global activate pana
          melos exec -- "dart pub global run pana --no-warning ."

  # Documentation generation test
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        run: |
          # These self-hosted runners intermittently produce an incomplete
          # Flutter checkout (empty bin/internal/engine.version), which yields a
          # broken `flutter//flutter_gpu.zip` URL and a failed bootstrap. Re-clone
          # until the engine version is present, precache serially before melos'
          # concurrent pub gets, and retry to absorb transient failures.
          export PATH="$RUNNER_TEMP/flutter/bin:$HOME/.pub-cache/bin:$PATH"
          ok=0
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/flutter"
            git clone --depth 1 -b 3.44.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter" \
              || { echo "::warning::clone failed (attempt $attempt)"; sleep 10; continue; }
            if [ ! -s "$RUNNER_TEMP/flutter/bin/internal/engine.version" ]; then
              echo "::warning::empty engine.version (attempt $attempt); re-cloning"; sleep 10; continue
            fi
            flutter --version \
              && flutter precache \
              && dart pub global activate melos \
              && melos bootstrap \
              && { ok=1; break; }
            echo "::warning::setup/bootstrap failed (attempt $attempt); retrying"; sleep 10
          done
          [ "$ok" = 1 ] || { echo "Flutter setup/bootstrap failed after retries"; exit 1; }
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: 📖 Generate Documentation
        run: |
          melos exec --scope="firestore_odm*" -- "dart doc --validate-links"

  # Live semantics e2e against the Firestore emulator (ADR-0002). The fake
  # cannot model Timestamp storage, index errors or real query semantics; this
  # lane is the deploy-layer behavior gate.
  e2e-emulator:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java (emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - name: 🔧 Setup Melos & Bootstrap
        run: |
          dart pub global activate melos
          melos bootstrap

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: 🔥 Run Emulator E2E
        working-directory: apps/flutter_example
        run: |
          npx --yes firebase-tools@latest emulators:exec             --only firestore --project demo-project             "flutter test integration_test --timeout 5m"

  # CI results summary
  ci-success:
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, security, docs, performance, e2e-emulator]
    if: always()
    steps:
      - name: 📊 CI Results Summary
        run: |
          echo "## 🎯 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.quality.result }}" == "success" ]]; then
            echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "✅ **Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.coverage.result }}" == "success" ]]; then
            echo "✅ **Coverage**: Generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Coverage**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.security.result }}" == "success" ]]; then
            echo "✅ **Security**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security**: Issues Found" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.docs.result }}" == "success" ]]; then
            echo "✅ **Documentation**: Generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Documentation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Repository**: https://github.com/SylphxAI/firestore_odm" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if any job failed
        if: ${{ needs.quality.result != 'success' || needs.test.result != 'success' || needs.coverage.result != 'success' || needs.security.result != 'success' || needs.docs.result != 'success' || needs.performance.result != 'success' || needs.e2e-emulator.result != 'success' }}
        run: exit 1

      - name: ✅ All CI Checks Passed
        run: |
          echo "🎉 All CI checks passed successfully!"
          echo "Ready for merge or release! 🚀"
