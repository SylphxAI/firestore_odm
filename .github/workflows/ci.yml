name: CI

# Each check runs once per landed change, on our own Linux runners (owner
# standards/dx.md). `ci-success` is the one required status check.
#
# Off until we host the OS: the macOS and Windows test lanes, and the
# Firestore emulator end-to-end tests, which run the Windows desktop test app
# (cloud_firestore has no Linux desktop implementation). Neither can be
# cross-compiled on Linux.
#
# Flutter is pinned in .github/actions/setup-flutter; bump it on purpose.

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'merge_group'
    runs-on: sylphx-linux-standard
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-flutter

      - name: Format
        run: melos run format:check --no-select
      - name: Generate code
        run: melos run generate
      - name: Analyze
        run: melos run analyze --no-select
      - name: Test (unit, generated code, benchmarks)
        run: melos run test:all --no-select
      - name: API docs
        run: melos exec -c 1 --scope="firestore_odm,firestore_odm_annotation,firestore_odm_builder" -- 'dart doc --validate-links --output "$(mktemp -d)"'
      - name: Publish dry run
        run: melos run publish:dry-run --no-select
      - name: pub.dev score (pana)
        # Allows 10 lost points: pana also scores "latest dependency
        # versions", which moves with outside releases. Dependencies resolve
        # from pub.dev.
        run: |
          # firestore_odm's README is a link to the repository README; publish
          # copies the file, so give pana the copy too.
          cp --remove-destination README.md packages/firestore_odm/README.md
          dart pub global activate pana
          melos exec --scope="firestore_odm,firestore_odm_annotation,firestore_odm_builder" -- dart pub global run pana --no-warning --exit-code-threshold 10 .

  site:
    if: github.event_name != 'merge_group'
    runs-on: sylphx-linux-standard
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - name: Build (fails on dead links)
        run: npm run build

  ci-success:
    if: always()
    needs: [check, site]
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - name: All jobs that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
