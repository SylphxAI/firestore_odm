name: CI

on:
  merge_group:
  workflow_dispatch: # Manual trigger
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Flutter is pinned to the current stable, 3.44.2 (Dart 3.12.2), deliberately —
# bump it on purpose in .github/actions/setup-flutter, don't float
# `channel: stable` (silent drift previously broke CI). The builder needs
# analyzer >=9 (Dart >=3.9). Every job sets Flutter up through that one
# composite action.

permissions:
  contents: read

concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

# Least privilege: jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  # Code quality checks
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter

      - name: 🎨 Check Code Formatting
        run: melos run format:check --no-select

      - name: 🔍 Analyze Code
        run: melos run analyze --no-select

      - name: 📋 Validate Publishing
        run: melos run publish:dry-run --no-select

  # Test matrix
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - profile: linux-standard
            runner: ubuntu-latest
            flutter-version: '3.44.2'
          - profile: macos-standard
            runner: macos-latest
            flutter-version: '3.44.2'
          - profile: windows-standard
            runner: windows-latest
            flutter-version: '3.44.2'
      fail-fast: false

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ matrix.flutter-version }}

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: 🧪 Run Unit Tests
        run: melos run test:unit --no-select

      - name: 🔬 Run Integration Tests
        run: melos run test:integration --no-select

  # Code coverage
  coverage:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: 📊 Generate Coverage
        # All tests live in flutter_example; `flutter test --coverage` writes
        # apps/flutter_example/coverage/lcov.info. (The old format_coverage step
        # relied on the removed `.packages` file and had no coverage input.)
        # --concurrency=1: runners have exhausted threads (pthread_create
        # failed) under coverage instrumentation at the default concurrency.
        run: melos exec --scope="flutter_example" -- flutter test --coverage --concurrency=1

      - name: 📤 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: apps/flutter_example/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Performance testing
  performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [quality]
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter

      - name: 🏗️ Generate Code
        run: melos run generate

      - name: ⚡ Performance Benchmarks
        run: melos exec --scope="flutter_example" -- flutter test --dart-define=PERFORMANCE_TEST=true --concurrency=1

  # Security scanning
  security:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter

      - name: 🔒 Security Audit
        run: |
          # Check outdated dependencies
          melos run deps:outdated --no-select || true

          # Check for known security vulnerabilities
          dart pub global activate pana
          melos exec -- "dart pub global run pana --no-warning ."

  # Documentation generation test
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter & Bootstrap
        uses: ./.github/actions/setup-flutter

      - name: 📖 Generate Documentation
        run: |
          melos exec --scope="firestore_odm*" -- "dart doc --validate-links"

  # CI results summary
  ci-success:
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, security, docs]
    if: always()
    steps:
      - name: 📊 CI Results Summary
        run: |
          echo "## 🎯 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.quality.result }}" == "success" ]]; then
            echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "✅ **Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.coverage.result }}" == "success" ]]; then
            echo "✅ **Coverage**: Generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Coverage**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.security.result }}" == "success" ]]; then
            echo "✅ **Security**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security**: Issues Found" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.docs.result }}" == "success" ]]; then
            echo "✅ **Documentation**: Generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Documentation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Repository**: https://github.com/SylphxAI/firestore_odm" >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if any job failed
        if: ${{ needs.quality.result != 'success' || needs.test.result != 'success' || needs.security.result != 'success' || needs.docs.result != 'success' }}
        run: exit 1

      - name: ✅ All CI Checks Passed
        run: |
          echo "🎉 All CI checks passed successfully!"
          echo "Ready for merge or release! 🚀"
