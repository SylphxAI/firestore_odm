name: Setup Flutter and bootstrap
description: >-
  Install the pinned Flutter SDK, activate melos, and bootstrap the workspace.
  The one Flutter setup every workflow job uses.

inputs:
  flutter-version:
    description: Flutter SDK version. Pinned deliberately; bump it on purpose.
    default: '3.44.2'
  bootstrap:
    description: Run `melos bootstrap` after activating melos.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Activate melos
      shell: bash
      run: dart pub global activate melos

    - name: Bootstrap workspace
      if: inputs.bootstrap == 'true'
      shell: bash
      # Through dart, not the `melos` shim: on Windows the shim is melos.bat,
      # which bash cannot run.
      run: dart pub global run melos bootstrap
