name: cloud_firestore_odm_benchmark
description: Runtime and code generation benchmark of cloud_firestore_odm (its last release).
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.0.0
  cloud_firestore_odm: 1.0.0-dev.88
  json_annotation: ^4.9.0

dev_dependencies:
  # The legacy generator requires build 2, analyzer <7 and source_gen 1.
  build_runner: 2.16.1
  # dev.90 calls analyzer APIs without their required withNullability argument.
  cloud_firestore_odm_generator: 1.0.0-dev.90
  fake_cloud_firestore: ^4.0.0
  flutter_test:
    sdk: flutter
  json_serializable: 6.14.1
