name: firestore_odm_workspace
description: A monorepo workspace for Firestore ODM packages
version: 1.0.0
homepage: https://github.com/SylphxAI/firestore_odm
repository: https://github.com/SylphxAI/firestore_odm

# This is a workspace root - should not be published
publish_to: none

environment:
  sdk: '^3.8.1'

# This is a workspace root - no dependencies needed
# Individual packages have their own dependencies

dev_dependencies:
  melos: ^6.3.0
  very_good_analysis: ^9.0.0

  
# NOTE: The library packages (firestore_odm, firestore_odm_annotation, firestore_odm_builder)
# are NOT included in the Dart workspace because they need explicit version constraints
# for pub.dev publishing. Melos handles local development path resolution instead.
# Only include app packages that don't need to be published.
workspace:
  - apps/flutter_example