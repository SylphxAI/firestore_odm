name: firestore_odm
description: "Type-safe Firestore ODM for Flutter and Dart — the maintained successor to cloud_firestore_odm."
version: 5.1.0
homepage: https://github.com/SylphxAI/firestore_odm
repository: https://github.com/SylphxAI/firestore_odm
issue_tracker: https://github.com/SylphxAI/firestore_odm/issues
documentation: https://SylphxAI.github.io/firestore_odm/

topics:
  - firestore
  - odm
  - firebase
  - flutter
  - code-generation

environment:
  sdk: '^3.8.1'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.4.0
  meta: ^1.9.1
  firestore_odm_annotation: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
