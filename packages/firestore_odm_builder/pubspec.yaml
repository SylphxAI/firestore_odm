name: firestore_odm_builder
description: "Code generator for firestore_odm, the type-safe Firestore ODM for Flutter and Dart. Generates typed queries, patches, aggregates and converters with build_runner."
version: 5.1.0
homepage: https://github.com/SylphxAI/firestore_odm
repository: https://github.com/SylphxAI/firestore_odm
issue_tracker: https://github.com/SylphxAI/firestore_odm/issues
documentation: https://SylphxAI.github.io/firestore_odm/

topics:
  - firestore
  - odm
  - code-generation
  - build-runner
  - flutter

environment:
  sdk: '^3.9.0'

dependencies:
  build: ^4.0.0
  source_gen: ^4.2.3
  # Wide range: the builder code targets the analyzer 8+ "new element model".
  # Kept open to <14 so downstreams can use current analyzer; consumers that also
  # use freezed (which currently caps <11) will resolve to analyzer 10.x.
  analyzer: '>=9.0.0 <15.0.0'
  json_annotation: ^4.9.0
  firestore_odm_annotation: ^5.0.0
  code_builder: ^4.11.1

dev_dependencies:
  build_runner: ^2.15.0
  test: ^1.25.0
  very_good_analysis: ^9.0.0

# Publishing to pub.dev (default when omitted)