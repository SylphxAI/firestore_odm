name: firestore_odm_workspace
repository: https://github.com/SylphxAI/firestore_odm

packages:
  # Direct children only — `**` recurses into apps/flutter_example/build/, where
  # cloud_firestore 6.6.0's bundled `pipeline_example` package appears twice
  # (ios + macos SourcePackages) and trips melos' duplicate-name check.
  - apps/*
  - packages/*
  - packages/firestore_odm/example

scripts:
  generate:
    run: melos exec -c 1 --depends-on build_runner -- dart run build_runner build --delete-conflicting-outputs
    description: Run build_runner in every package that uses it.

  analyze:
    # Needs `generate` first. The test app stays out: its models exercise
    # edge cases that trip lints on purpose.
    run: melos exec --ignore="flutter_example" -- dart analyze --fatal-infos .
    description: Static analysis of the published packages.

  format:check:
    run: dart format --output=none --set-exit-if-changed .
    description: Fail when any file is not formatted.

  test:unit:
    run: melos exec --ignore="flutter_example" --dir-exists="test" -- dart test
    description: Unit tests of the published packages (the migration codemod).

  test:integration:
    run: melos exec -c 1 --scope="flutter_example,firestore_odm_example" -- flutter test
    description: Generated-code tests against an in-memory Firestore, plus benchmarks.

  test:e2e:
    # Needs Java 21 and Node; starts the Firestore emulator on localhost:8080.
    run: melos exec --scope="flutter_example" -- npx --yes firebase-tools emulators:exec --only firestore --project demo-project "flutter test integration_test --timeout 5m"
    description: End-to-end tests against the Firestore emulator.

  test:all:
    run: melos run test:unit --no-select && melos run test:integration --no-select
    description: Unit and generated-code tests.

  check:
    run: melos run format:check --no-select && melos run generate --no-select && melos run analyze --no-select && melos run test:all --no-select
    description: Everything the pull request check runs, except pana and docs.

  publish:dry-run:
    run: melos exec --scope="firestore_odm_annotation,firestore_odm,firestore_odm_builder" -- dart pub publish --dry-run
    description: Verify the packages are ready to publish.
