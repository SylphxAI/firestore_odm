name: firestore_odm_workspace
repository: https://github.com/SylphxAI/firestore_odm

packages:
  - apps/**
  - packages/**

command:
  version:
    updateGitTagRefs: true
    workspaceChangelog: true

scripts:
  generate:
    run: melos exec -c 1 --depends-on build_runner -- dart run build_runner build
    
  # Development scripts
  analyze:
    # `melos exec` runs per-package; a plain `run` would execute once at the
    # workspace root (melos >=6), defeating the flutter_example exclusion.
    run: melos exec --ignore="flutter_example" -- dart analyze .
    description: Run static analysis on all packages.

  test:
    run: melos exec --ignore="flutter_example" --dir-exists="test" -- dart test
    description: Run tests in all packages (those with a test/ dir).

  fix:
    run: dart fix --apply
    description: Apply automated fixes to all packages.

  format:check:
    run: dart format --output=none --set-exit-if-changed .
    description: Check if all files are formatted correctly.

  build:example:
    run: melos exec --scope="flutter_example" -- dart run build_runner build --delete-conflicting-outputs
    description: Generate code for the example.

  # Testing scripts
  test:unit:
    # `--dir-exists=test` skips packages without a test/ dir; otherwise
    # `dart test` aborts with "Could not find package test". Currently no
    # library package has unit tests — all tests are integration tests.
    run: melos exec --ignore="flutter_example" --dir-exists="test" -- dart test
    description: Run unit tests (packages with a test/ dir).

  test:integration:
    run: melos exec --scope="flutter_example" -- flutter test
    description: Run integration tests.

  test:all:
    run: |
      melos run test:unit --no-select &&
      melos run test:integration --no-select
    description: Run all tests (unit + integration).

  # Code quality scripts
  analyze:fix:
    run: dart fix --apply
    description: Apply automated fixes.
    packageFilters:
      ignore:
        - flutter_example

  check:
    run: |
      melos run format:check --no-select &&
      melos run analyze --no-select &&
      melos run test:all --no-select
    description: Run all checks (format, analyze, test).

  # Release preparation scripts
  clean:
    run: |
      flutter clean &&
      dart pub cache repair
    description: Clean build artifacts and repair pub cache.
    packageFilters:
      flutter: true

  deps:
    run: dart pub deps
    description: Show dependency tree.

  deps:outdated:
    run: dart pub outdated
    description: Check for outdated dependencies.

  sync:readme:
    run: |
      copy README.md packages\firestore_odm\README.md
      copy README.md packages\firestore_odm_annotation\README.md
      copy README.md packages\firestore_odm_builder\README.md
    description: Sync README.md to all packages.

  # Publishing scripts
  publish:dry-run:
    run: melos exec --scope="firestore_odm_annotation,firestore_odm,firestore_odm_builder" -- dart pub publish --dry-run
    description: Verify packages are ready to publish.

  publish:packages:
    run: dart pub publish --force
    description: Publish packages to pub.dev.
    packageFilters:
      scope:
        - firestore_odm_annotation
        - firestore_odm
        - firestore_odm_builder
    exec:
      orderDependents: true
